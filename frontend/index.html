<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Font preconnect for speed -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.fontshare.com">

    <!-- Clash Display - headings, titles, brand name -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700,800,900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700,800,900&display=swap"
      />
    </noscript>

    <!-- Cabinet Grotesk - body text, paragraphs, inputs -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700&display=swap"
      />
    </noscript>

    <!-- Preconnect to backend API -->
    <link rel="preconnect" href="https://careerlens-backend.onrender.com">
    <link rel="dns-prefetch" href="https://careerlens-backend.onrender.com">

    <!-- Preconnect to Supabase -->
    <link rel="preconnect" href="https://gtnhdawkskyghoohezlk.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://gtnhdawkskyghoohezlk.supabase.co">

    <!-- Preconnect to Simple Icons CDN (used for company logos) -->
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>

    <!-- Preconnect to Stripe -->
    <link rel="preconnect" href="https://js.stripe.com">

    <!-- App metadata -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CareerLens - AI-powered resume analyzer and career guidance platform"
    />
    <meta name="theme-color" content="#2563EB">
    <meta name="application-name" content="CareerLens">
    <title>CareerLens - AI Career Platform</title>

    <style>
      /* System font fallback while Fontshare loads */
      :root {
        --font-display: 'Clash Display', 'SF Pro Display',
                        -apple-system, 'Segoe UI', sans-serif;
        --font-body:    'Cabinet Grotesk', 'SF Pro Text',
                        -apple-system, 'Segoe UI', sans-serif;
      }
    </style>

    <style>
      @keyframes init-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .init-skeleton {
        position: relative;
        overflow: hidden;
        background: rgba(226, 232, 240, 0.65);
        border-radius: 12px;
      }
      .init-skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: init-shimmer 1.8s infinite;
      }
    </style>
  </head>
  <body style="margin: 0; background: #F4F7FC;">
    <div id="root">
      <!-- Instant First-Paint Skeleton (Replaced as soon as React hydrates) -->
      <div style="min-height: 100vh; background: #F4F7FC; font-family: system-ui, -apple-system, sans-serif;">
        <!-- Header -->
        <div style="height: 64px; background: rgba(255, 255, 255, 0.8); border-bottom: 1px solid rgba(226, 232, 240, 0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="init-skeleton" style="width: 36px; height: 36px; border-radius: 10px;"></div>
            <div class="init-skeleton" style="width: 110px; height: 20px;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="init-skeleton" style="width: 80px; height: 36px; border-radius: 9999px;"></div>
            <div class="init-skeleton" style="width: 104px; height: 36px; border-radius: 9999px;"></div>
          </div>
        </div>
        <!-- Hero Content -->
        <div style="max-width: 1120px; margin: 40px auto; padding: 0 24px; box-sizing: border-box;">
          <div class="init-skeleton" style="width: 170px; height: 28px; border-radius: 9999px; margin-bottom: 24px;"></div>
          <div class="init-skeleton" style="width: 80%; max-width: 600px; height: 48px; border-radius: 16px; margin-bottom: 16px;"></div>
          <div class="init-skeleton" style="width: 55%; max-width: 420px; height: 48px; border-radius: 16px; margin-bottom: 24px;"></div>
          <div class="init-skeleton" style="width: 65%; max-width: 500px; height: 18px; margin-bottom: 32px;"></div>
          <div style="display: flex; gap: 14px; margin-bottom: 48px;">
            <div class="init-skeleton" style="width: 160px; height: 46px; border-radius: 9999px;"></div>
            <div class="init-skeleton" style="width: 130px; height: 46px; border-radius: 9999px;"></div>
          </div>
          <!-- Cards -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <div class="init-skeleton" style="height: 150px; border-radius: 20px; background: rgba(255, 255, 255, 0.7);"></div>
            <div class="init-skeleton" style="height: 150px; border-radius: 20px; background: rgba(255, 255, 255, 0.7);"></div>
            <div class="init-skeleton" style="height: 150px; border-radius: 20px; background: rgba(255, 255, 255, 0.7);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
